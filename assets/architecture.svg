<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">How the approval queue works</title>
  <desc id="desc">The agent proposes and later redeems through the API with its own keys. A manager decides on the review page with their CMS session. Both doors meet only at the approval row, and an approved row is consumed by one matching write.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d9188"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#176b45"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#f5f5f3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#171816">
    <text x="460" y="32" text-anchor="middle" font-size="15" font-weight="700">Two doors, one approval row</text>

    <!-- door labels -->
    <text x="305" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#8d9188" letter-spacing="1">AGENT DOOR</text>
    <text x="770" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#176b45" letter-spacing="1">MANAGER DOOR</text>

    <!-- agent -->
    <rect x="40" y="72" width="220" height="90" rx="10" fill="#fff" stroke="#dedfd9"/>
    <text x="150" y="106" text-anchor="middle" font-size="14" font-weight="700">AI agent</text>
    <text x="150" y="127" text-anchor="middle" font-size="11" fill="#656861">read + write keys</text>
    <text x="150" y="145" text-anchor="middle" font-size="11" fill="#656861">cannot approve</text>

    <!-- api -->
    <rect x="350" y="72" width="220" height="90" rx="10" fill="#fff" stroke="#dedfd9"/>
    <text x="460" y="106" text-anchor="middle" font-size="14" font-weight="700">API</text>
    <text x="460" y="127" text-anchor="middle" font-size="11" fill="#656861">scoped keys + guard</text>
    <text x="460" y="145" text-anchor="middle" font-size="11" fill="#656861">bind JSON, consume once</text>

    <!-- review page -->
    <rect x="660" y="72" width="220" height="90" rx="10" fill="#edf7f1" stroke="#72a88d"/>
    <text x="770" y="106" text-anchor="middle" font-size="14" font-weight="700">Review page</text>
    <text x="770" y="127" text-anchor="middle" font-size="11" fill="#656861">manager's CMS session</text>
    <text x="770" y="145" text-anchor="middle" font-size="11" fill="#656861">no API key on the page</text>

    <!-- approval row -->
    <rect x="250" y="228" width="420" height="100" rx="10" fill="#fff" stroke="#dedfd9"/>
    <text x="460" y="264" text-anchor="middle" font-size="14" font-weight="700">Approval row</text>
    <text x="460" y="286" text-anchor="middle" font-size="12" fill="#656861">resource &#183; action &#183; scope &#183; immutable JSON</text>
    <text x="460" y="306" text-anchor="middle" font-size="12" fill="#656861">status &#183; expiry &#183; decidedBy &#183; audit</text>

    <!-- transaction -->
    <rect x="250" y="378" width="420" height="58" rx="10" fill="#fff8df" stroke="#ecd38f"/>
    <text x="460" y="412" text-anchor="middle" font-size="13" font-weight="700">Single-use consume + write + audit (one transaction)</text>

    <!-- arrows -->
    <path d="M260 117 H348" stroke="#8d9188" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="305" y="108" text-anchor="middle" font-size="10" fill="#656861">propose</text>
    <text x="305" y="134" text-anchor="middle" font-size="10" fill="#656861">redeem</text>

    <path d="M460 162 V226" stroke="#8d9188" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="470" y="199" font-size="10" fill="#656861">Pending row, then match on redeem</text>

    <path d="M770 162 V278 H672" stroke="#176b45" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)"/>
    <text x="780" y="199" font-size="10" fill="#176b45">approve &#183; reject &#183; changes</text>

    <path d="M460 328 V376" stroke="#8d9188" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="470" y="356" font-size="10" fill="#656861">first matching write wins</text>
  </g>
</svg>
